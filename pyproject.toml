[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "A private, local-first personal AI assistant for your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jarvis Local contributors" }]
keywords = ["ai", "assistant", "local-first", "privacy", "ollama", "rag", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "platformdirs>=4.2.0",
]

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.130.0",
  "google-auth-oauthlib>=1.2.0",
]
docs = [
  "pypdf>=4.2.0",
  "python-docx>=1.1.0",
]
all = [
  "jarvis-local[google,docs]",
]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
jarvis = "jarvis_local.cli:run"

[project.urls]
Homepage = "https://github.com/reyyanking110/ai-chatbot"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer.Argument/Option in defaults is idiomatic Typer
